[package]
name = "traductor-desktop"
version = "1.0.0"
description = "Real-time voice-to-voice translation desktop application"
authors = ["Traductor Team"]
edition = "2021"

[lib]
name = "traductor_desktop_lib"
# staticlib is needed for Tauri integration
# rlib is used for tests and internal Rust dependencies
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures-util = "0.3"

# WebSocket for Gemini Live
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.21"

# Database with encryption support
rusqlite = { version = "0.31", features = ["bundled"] }

# Secure credential storage
keyring = "2.3"

# HTTP client for Token Service and API calls
reqwest = { version = "0.11", features = ["json", "native-tls"] }

# Audio processing - resampling (optional - only with audio feature)
rubato = { version = "0.14", optional = true }
hound = { version = "3.5", optional = true }  # WAV encoding for debug

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation for session IDs
uuid = { version = "1.6", features = ["v4"] }

# URL parsing and regex for validation
url = "2.5"
regex = "1.10"

# Directory and system utilities
dirs = "5.0"
machine-uid = "0.5"

# Error reporting (optional)
sentry = { version = "0.32", optional = true }

[dev-dependencies]
tempfile = "3.10"
proptest = "1.4"

# ============================================
# Platform-specific dependencies
# ============================================

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", optional = true, features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Foundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
    "implement"
] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit-sys = { version = "0.2", optional = true }
coreaudio-rs = { version = "0.11", optional = true }

[features]
default = ["audio", "tauri-plugins"]
audio = ["dep:windows", "dep:rubato", "dep:hound"]
sentry = ["dep:sentry"]
# Feature to include heavy Tauri plugins (disabled for testing)
tauri-plugins = ["dep:tauri-plugin-dialog", "dep:tauri-plugin-notification"]

# ============================================
# Release Profile Optimizations
# ============================================
[profile.release]
# Link-Time Optimization for smaller binary
lto = true
# Single codegen unit for better optimization
codegen-units = 1
# Strip debug symbols
strip = true
# Optimize for size
opt-level = "z"
# Abort on panic (smaller binary, no unwinding)
panic = "abort"

